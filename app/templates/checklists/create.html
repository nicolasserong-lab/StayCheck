{% extends "base.html" %}

{% block title %}Crear Checklist - StayCheck{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h2 class="fw-bold"><i class="bi bi-file-earmark-plus text-success"></i> Nuevo Checklist</h2>
        <p class="text-muted">Diseña una nueva plantilla de tareas.</p>
    </div>
</div>

<form method="POST">
    <div class="row">
        <!-- Columna Izquierda: Datos Básicos -->
        <div class="col-12 col-lg-5 mb-4">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-header bg-white border-0 pt-4 pb-0">
                    <h5 class="fw-bold">1. Información General</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="titulo" class="form-label">Título de la Tarea</label>
                        <input type="text" class="form-control bg-light" id="titulo" name="titulo" required placeholder="Ej. Limpieza Profunda">
                    </div>
                    <div class="mb-3">
                        <label for="descripcion" class="form-label">Descripción</label>
                        <textarea class="form-control bg-light" id="descripcion" name="descripcion" rows="3" placeholder="Breve instrucción para el operador..."></textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- Columna Derecha: Constructor de Items Dinámicos -->
        <div class="col-12 col-lg-7 mb-4">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-header bg-white border-0 pt-4 pb-0 d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold mb-0">2. Constructor de Items</h5>
                    <button type="button" class="btn btn-sm btn-outline-success rounded-pill" onclick="agregarItem()">
                        <i class="bi bi-plus"></i> Añadir Fila
                    </button>
                </div>
                <div class="card-body">
                    <div id="items-container">
                        <!-- Item base oculto para clonar -->
                        <div class="item-row row g-2 align-items-end mb-3 d-none" id="item-template">
                            <div class="col-7 col-md-8">
                                <label class="form-label small text-muted mb-1">Pregunta / Tarea</label>
                                <input type="text" class="form-control item-texto" disabled placeholder="Ej. Verificar sábanas">
                            </div>
                            <div class="col-4 col-md-3">
                                <label class="form-label small text-muted mb-1">Tipo</label>
                                <select class="form-select item-tipo" disabled>
                                    <option value="checkbox">Checkbox (Sí/No)</option>
                                    <option value="texto">Texto Corto</option>
                                    <option value="numero">Número</option>
                                    <option value="observaciones">Observación Larga</option>
                                </select>
                            </div>
                            <div class="col-1 col-md-1 text-end">
                                <button type="button" class="btn btn-outline-danger btn-sm rounded-circle" onclick="eliminarItem(this)">
                                    <i class="bi bi-x"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div id="items-list">
                        <!-- Aquí se inyectan los items clonados -->
                    </div>
                    
                    <div id="empty-state" class="text-center py-4 text-muted">
                        <i class="bi bi-list-task fs-1"></i>
                        <p class="mb-0">Agrega tareas a esta plantilla.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Acciones -->
    <div class="row">
        <div class="col-12 text-end">
            <a href="{{ url_for('checklists.index') }}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
            <button type="submit" class="btn btn-success rounded-pill fw-semibold px-4 ms-2">Guardar Plantilla</button>
        </div>
    </div>
</form>

<script>
    // JS para manejar el formulario dinámico
    function agregarItem() {
        document.getElementById('empty-state').classList.add('d-none');
        const template = document.getElementById('item-template');
        const clon = template.cloneNode(true);
        
        clon.id = ''; // Remove ID
        clon.classList.remove('d-none');
        
        // Habilitar y renombrar name attr para enviar al servidor
        const inputTexto = clon.querySelector('.item-texto');
        inputTexto.name = 'item_texto[]';
        inputTexto.disabled = false;
        inputTexto.required = true;

        const selectTipo = clon.querySelector('.item-tipo');
        selectTipo.name = 'item_tipo[]';
        selectTipo.disabled = false;

        document.getElementById('items-list').appendChild(clon);
    }

    function eliminarItem(btn) {
        btn.closest('.item-row').remove();
        if (document.getElementById('items-list').children.length === 0) {
            document.getElementById('empty-state').classList.remove('d-none');
        }
    }
    
    // Iniciar con un item por defecto
    window.onload = function() {
        agregarItem();
    };
</script>
{% endblock %}
